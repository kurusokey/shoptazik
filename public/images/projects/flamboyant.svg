<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg2)"/>
  <!-- Flame shapes -->
  <g opacity="0.15">
    <ellipse cx="160" cy="200" rx="30" ry="80" fill="url(#flame)" transform="rotate(-10 160 200)"/>
    <ellipse cx="200" cy="180" rx="35" ry="100" fill="url(#flame)"/>
    <ellipse cx="240" cy="200" rx="30" ry="80" fill="url(#flame)" transform="rotate(10 240 200)"/>
  </g>
  <!-- Center diamond -->
  <rect x="175" y="155" width="50" height="50" rx="4" fill="none" stroke="#fbbf24" stroke-width="2" transform="rotate(45 200 180)"/>
  <rect x="185" y="165" width="30" height="30" rx="2" fill="#fbbf24" opacity="0.3" transform="rotate(45 200 180)"/>
  <!-- Title -->
  <text x="200" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="white">FLAMBOYANT</text>
  <text x="200" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a1a1aa">FDY PHENOMEN</text>
  <text x="200" y="358" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#fbbf24">2022 - ALBUM</text>
  <rect x="0" y="0" width="400" height="3" fill="#fbbf24"/>
  <rect x="0" y="397" width="400" height="3" fill="#fbbf24" opacity="0.3"/>
</svg>