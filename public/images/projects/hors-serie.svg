<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg4)"/>
  <!-- TV static pattern -->
  <g opacity="0.08" fill="#fbbf24">
    <rect x="80" y="100" width="3" height="3"/><rect x="95" y="110" width="3" height="3"/>
    <rect x="130" y="105" width="3" height="3"/><rect x="155" y="120" width="3" height="3"/>
    <rect x="180" y="100" width="3" height="3"/><rect x="210" y="115" width="3" height="3"/>
    <rect x="240" y="108" width="3" height="3"/><rect x="270" y="125" width="3" height="3"/>
    <rect x="300" y="100" width="3" height="3"/><rect x="90" y="145" width="3" height="3"/>
    <rect x="120" y="160" width="3" height="3"/><rect x="150" y="150" width="3" height="3"/>
    <rect x="180" y="165" width="3" height="3"/><rect x="220" y="155" width="3" height="3"/>
    <rect x="250" y="170" width="3" height="3"/><rect x="280" y="148" width="3" height="3"/>
    <rect x="100" y="195" width="3" height="3"/><rect x="140" y="200" width="3" height="3"/>
    <rect x="170" y="210" width="3" height="3"/><rect x="230" y="195" width="3" height="3"/>
    <rect x="260" y="205" width="3" height="3"/><rect x="290" y="190" width="3" height="3"/>
  </g>
  <!-- TV frame -->
  <rect x="110" y="100" width="180" height="140" rx="8" fill="none" stroke="#3f3f46" stroke-width="2"/>
  <rect x="120" y="110" width="160" height="120" rx="4" fill="#27272a"/>
  <!-- "HORS" text inside TV -->
  <text x="200" y="170" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#fbbf24" opacity="0.6">H.S.</text>
  <line x1="130" y1="185" x2="270" y2="185" stroke="#fbbf24" stroke-width="1" opacity="0.3"/>
  <!-- TV antenna -->
  <line x1="175" y1="100" x2="155" y2="70" stroke="#3f3f46" stroke-width="2"/>
  <line x1="225" y1="100" x2="245" y2="70" stroke="#3f3f46" stroke-width="2"/>
  <!-- Title -->
  <text x="200" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="white">HORS SERIE</text>
  <text x="200" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a1a1aa">FDY PHENOMEN</text>
  <text x="200" y="358" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#fbbf24">2019 - EP</text>
  <rect x="0" y="0" width="400" height="3" fill="#fbbf24"/>
  <rect x="0" y="397" width="400" height="3" fill="#fbbf24" opacity="0.3"/>
</svg>