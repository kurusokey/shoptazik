<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg7)"/>
  <!-- Knife / cleaver shape -->
  <g transform="translate(200, 160)" opacity="0.25">
    <!-- Blade -->
    <rect x="-50" y="-25" width="100" height="50" rx="4" fill="#fbbf24"/>
    <!-- Handle -->
    <rect x="50" y="-15" width="35" height="30" rx="3" fill="#3f3f46" stroke="#52525b" stroke-width="1"/>
    <!-- Blade edge -->
    <line x1="-50" y1="25" x2="50" y2="25" stroke="#f59e0b" stroke-width="2"/>
    <!-- Rivets on handle -->
    <circle cx="60" cy="0" r="3" fill="#52525b"/>
    <circle cx="75" cy="0" r="3" fill="#52525b"/>
  </g>
  <!-- Cutting marks -->
  <g opacity="0.1" stroke="#fbbf24" stroke-width="1">
    <line x1="140" y1="200" x2="260" y2="200"/>
    <line x1="150" y1="210" x2="250" y2="210"/>
    <line x1="160" y1="220" x2="240" y2="220"/>
  </g>
  <!-- Title -->
  <text x="200" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="white">CHARCUTIER</text>
  <text x="200" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a1a1aa">FDY PHENOMEN</text>
  <text x="200" y="358" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#fbbf24">2016 - ALBUM</text>
  <rect x="0" y="0" width="400" height="3" fill="#fbbf24"/>
  <rect x="0" y="397" width="400" height="3" fill="#fbbf24" opacity="0.3"/>
</svg>