<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg1)"/>
  <!-- Vinyl record -->
  <circle cx="200" cy="180" r="90" fill="none" stroke="#3f3f46" stroke-width="2"/>
  <circle cx="200" cy="180" r="70" fill="none" stroke="#3f3f46" stroke-width="1"/>
  <circle cx="200" cy="180" r="50" fill="none" stroke="#3f3f46" stroke-width="1"/>
  <circle cx="200" cy="180" r="15" fill="#fbbf24"/>
  <circle cx="200" cy="180" r="5" fill="#18181b"/>
  <!-- Microphone icon -->
  <g transform="translate(200, 175)" opacity="0.2">
    <rect x="-4" y="-30" width="8" height="35" rx="4" fill="#fbbf24"/>
    <circle cx="0" cy="-35" r="12" fill="none" stroke="#fbbf24" stroke-width="2"/>
  </g>
  <!-- Title -->
  <text x="200" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="white">CHANTEUR DE RAP</text>
  <text x="200" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a1a1aa">FDY PHENOMEN</text>
  <text x="200" y="358" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#fbbf24">2024 - ALBUM</text>
  <!-- Border accent -->
  <rect x="0" y="0" width="400" height="3" fill="#fbbf24"/>
  <rect x="0" y="397" width="400" height="3" fill="#fbbf24" opacity="0.3"/>
</svg>