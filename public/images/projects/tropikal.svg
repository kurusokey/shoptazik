<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg5)"/>
  <!-- Sun -->
  <circle cx="200" cy="160" r="50" fill="url(#sun)" opacity="0.25"/>
  <!-- Sun rays -->
  <g opacity="0.1" stroke="#fbbf24" stroke-width="2">
    <line x1="200" y1="95" x2="200" y2="75"/>
    <line x1="235" y1="105" x2="248" y2="88"/>
    <line x1="255" y1="135" x2="275" y2="128"/>
    <line x1="255" y1="165" x2="275" y2="172"/>
    <line x1="235" y1="195" x2="248" y2="212"/>
    <line x1="165" y1="105" x2="152" y2="88"/>
    <line x1="145" y1="135" x2="125" y2="128"/>
    <line x1="145" y1="165" x2="125" y2="172"/>
    <line x1="165" y1="195" x2="152" y2="212"/>
  </g>
  <!-- Palm tree -->
  <rect x="297" y="150" width="6" height="120" rx="3" fill="#3f3f46"/>
  <!-- Palm leaves -->
  <g fill="#3f3f46" opacity="0.7">
    <ellipse cx="280" cy="145" rx="35" ry="8" transform="rotate(-20 280 145)"/>
    <ellipse cx="320" cy="140" rx="30" ry="7" transform="rotate(25 320 140)"/>
    <ellipse cx="295" cy="135" rx="25" ry="6" transform="rotate(-40 295 135)"/>
    <ellipse cx="315" cy="148" rx="28" ry="7" transform="rotate(40 315 148)"/>
  </g>
  <!-- Horizon line -->
  <line x1="60" y1="230" x2="340" y2="230" stroke="#3f3f46" stroke-width="1"/>
  <!-- Water reflection lines -->
  <g opacity="0.1" stroke="#fbbf24" stroke-width="1">
    <line x1="170" y1="240" x2="230" y2="240"/>
    <line x1="160" y1="250" x2="240" y2="250"/>
    <line x1="175" y1="260" x2="225" y2="260"/>
  </g>
  <!-- Title -->
  <text x="200" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="white">TROPIKAL</text>
  <text x="200" y="335" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a1a1aa">FDY PHENOMEN</text>
  <text x="200" y="358" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#fbbf24">2018 - ALBUM</text>
  <rect x="0" y="0" width="400" height="3" fill="#fbbf24"/>
  <rect x="0" y="397" width="400" height="3" fill="#fbbf24" opacity="0.3"/>
</svg>