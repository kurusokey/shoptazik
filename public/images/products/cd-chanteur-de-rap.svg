<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="pbg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <radialGradient id="cdshine" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="50%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#27272a"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#pbg2)"/>
  <!-- CD case -->
  <rect x="105" y="70" width="190" height="215" rx="4" fill="#27272a" stroke="#3f3f46" stroke-width="1.5"/>
  <!-- CD case spine highlight -->
  <rect x="105" y="70" width="8" height="215" fill="#3f3f46" opacity="0.5"/>
  <!-- CD disc -->
  <circle cx="200" cy="175" r="80" fill="url(#cdshine)"/>
  <circle cx="200" cy="175" r="75" fill="none" stroke="#52525b" stroke-width="0.5"/>
  <circle cx="200" cy="175" r="55" fill="none" stroke="#52525b" stroke-width="0.3"/>
  <!-- Rainbow refraction on CD -->
  <g opacity="0.08">
    <ellipse cx="180" cy="155" rx="40" ry="15" fill="#fbbf24" transform="rotate(-30 180 155)"/>
    <ellipse cx="220" cy="190" rx="35" ry="12" fill="#fbbf24" transform="rotate(20 220 190)"/>
  </g>
  <!-- Center hole -->
  <circle cx="200" cy="175" r="18" fill="#18181b"/>
  <circle cx="200" cy="175" r="15" fill="none" stroke="#3f3f46" stroke-width="1"/>
  <!-- Album title on case -->
  <text x="200" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#fbbf24" opacity="0.6">CHANTEUR DE RAP</text>
  <!-- Title -->
  <text x="200" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="white">CD "CHANTEUR DE RAP"</text>
  <text x="200" y="352" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a1a1aa">Digipack avec livret</text>
  <text x="200" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">14,90 EUR</text>
  <rect x="0" y="0" width="400" height="3" fill="#fbbf24"/>
</svg>