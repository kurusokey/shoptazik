<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="pbg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <radialGradient id="vinyl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="15%" stop-color="#f59e0b"/>
      <stop offset="20%" stop-color="#27272a"/>
      <stop offset="45%" stop-color="#3f3f46"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="75%" stop-color="#3f3f46"/>
      <stop offset="80%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#pbg1)"/>
  <!-- Album sleeve behind -->
  <rect x="100" y="70" width="210" height="210" rx="4" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <!-- Vinyl disc -->
  <circle cx="220" cy="200" r="95" fill="url(#vinyl)" opacity="0.9"/>
  <circle cx="220" cy="200" r="90" fill="none" stroke="#52525b" stroke-width="0.5"/>
  <circle cx="220" cy="200" r="70" fill="none" stroke="#52525b" stroke-width="0.3"/>
  <circle cx="220" cy="200" r="50" fill="none" stroke="#52525b" stroke-width="0.3"/>
  <circle cx="220" cy="200" r="30" fill="none" stroke="#52525b" stroke-width="0.3"/>
  <!-- Center label -->
  <circle cx="220" cy="200" r="18" fill="#fbbf24"/>
  <circle cx="220" cy="200" r="3" fill="#18181b"/>
  <text x="220" y="203" text-anchor="middle" font-family="system-ui, sans-serif" font-size="6" font-weight="700" fill="#18181b">FDY</text>
  <!-- Badge limited -->
  <rect x="30" y="30" width="90" height="24" rx="12" fill="#fbbf24"/>
  <text x="75" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#18181b">ED. LIMITEE</text>
  <!-- Title -->
  <text x="200" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="white">VINYLE "CHANTEUR DE RAP"</text>
  <text x="200" y="352" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a1a1aa">Classic Edition - 33 tours</text>
  <text x="200" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">29,90 EUR</text>
  <rect x="0" y="0" width="400" height="3" fill="#fbbf24"/>
</svg>